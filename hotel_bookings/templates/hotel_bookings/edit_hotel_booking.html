{% extends "base.html" %}
{% block title %}Edit Booking{% endblock %}

{% block head %}
{{ super() }}
<style>
    /* same styles as create form */
    .booking-form-card {
        background: var(--cream);
        border: none;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }
    .booking-form-card .card-header {
        background: transparent;
        border-bottom: 2px solid var(--orange);
        padding: 2rem 2rem 1rem;
        text-align: center;
    }
    .booking-form-card .card-header h2 {
        color: var(--green);
        font-family: 'Playfair Display', serif;
        font-weight: 700;
    }
    .booking-form-card .card-body {
        padding: 2rem;
    }
    .form-label {
        color: var(--green);
        font-weight: 600;
    }
    .form-control {
        border: 2px solid transparent;
        background: white;
        padding: 0.8rem 1.2rem;
        border-radius: 10px;
        transition: all 0.3s ease;
    }
    .form-control:focus {
        border-color: var(--orange);
        box-shadow: none;
        outline: none;
    }
    .btn-submit {
        background: var(--green);
        color: white;
        padding: 0.8rem 2rem;
        border: none;
        border-radius: 40px;
        font-weight: 600;
        width: 100%;
        transition: all 0.3s ease;
    }
    .btn-submit:hover {
        background: var(--orange);
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(44, 95, 45, 0.3);
    }
    .hotel-summary {
        background: white;
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 2rem;
        border-left: 4px solid var(--orange);
    }
    .hotel-summary h4 {
        color: var(--green);
        font-weight: 700;
    }
</style>
{% endblock %}

{% block body %}
<div class="container py-6" style="min-height: 80vh; display: flex; align-items: center;">
    <div class="row justify-content-center w-100">
        <div class="col-md-8 col-lg-6" data-aos="fade-up">
            <div class="booking-form-card">
                <div class="card-header">
                    <h2>Edit Booking for {{ booking.hotel.name }}</h2>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('hotel.edit_hotel_booking', booking_id=booking.id) }}">
                        <div class="mb-3">
                            <label class="form-label">Check‑in Date</label>
                            <input type="date" name="check_in" class="form-control" value="{{ booking.check_in.strftime('%Y-%m-%d') }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Check‑out Date</label>
                            <input type="date" name="check_out" class="form-control" value="{{ booking.check_out.strftime('%Y-%m-%d') }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Number of Rooms</label>
                            <input type="number" name="rooms" class="form-control" value="{{ booking.rooms }}" min="1" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Total Price (USD)</label>
                            <input type="number" step="0.01" name="total_price" class="form-control" value="{{ booking.total_price }}" required>
                        </div>
                        <button type="submit" class="btn-submit">Update Booking</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
