{% extends "base.html" %}
{% block title %}Create Ticket{% endblock %}

{% block head %}
{{ super() }}
<style>
    .ticket-form-card {
        background: var(--cream);
        border: none;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }
    .ticket-form-card .card-header {
        background: transparent;
        border-bottom: 2px solid var(--orange);
        padding: 2rem 2rem 1rem;
        text-align: center;
    }
    .ticket-form-card .card-header h2 {
        color: var(--green);
        font-family: 'Playfair Display', serif;
        font-weight: 700;
    }
    .ticket-form-card .card-body {
        padding: 2rem;
    }
    .form-label {
        color: var(--green);
        font-weight: 600;
    }
    .form-control {
        border: 2px solid transparent;
        background: white;
        padding: 0.8rem 1.2rem;
        border-radius: 10px;
        transition: all 0.3s ease;
    }
    .form-control:focus {
        border-color: var(--orange);
        box-shadow: none;
        outline: none;
    }
    .btn-submit {
        background: var(--green);
        color: white;
        padding: 0.8rem 2rem;
        border: none;
        border-radius: 40px;
        font-weight: 600;
        width: 100%;
        transition: all 0.3s ease;
    }
    .btn-submit:hover {
        background: var(--orange);
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(44, 95, 45, 0.3);
    }
</style>
{% endblock %}

{% block body %}
<div class="container py-6" style="min-height: 80vh; display: flex; align-items: center;">
    <div class="row justify-content-center w-100">
        <div class="col-md-8 col-lg-6" data-aos="fade-up">
            <div class="ticket-form-card">
                <div class="card-header">
                    <h2>Create Support Ticket</h2>
                    <p class="text-muted">Describe your issue or question</p>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('tickets.create_ticket') }}">
                        <div class="mb-3">
                            <label class="form-label">Subject</label>
                            <input type="text" name="subject" class="form-control" required placeholder="Brief summary">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Message</label>
                            <textarea name="message" class="form-control" rows="6" required placeholder="Provide details..."></textarea>
                        </div>
                        <button type="submit" class="btn-submit">Submit Ticket</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
